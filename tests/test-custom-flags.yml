name: Test custom black_flags - line length override
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run black check on directory with custom line-length flag
        id: action
        uses: .
        with:
          path: tests/fixtures/good
          black_flags: "--line-length 200"

      - name: Assert black check passed with custom line-length flag
        run: |
          echo "PASS: black check succeeded with --line-length 200 flag"

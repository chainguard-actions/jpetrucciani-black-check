name: Test custom black flags - line length
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          path: tests/fixtures/long-lines
          black_flags: '--line-length 120'
      - name: Assert action succeeded with custom line length
        run: |
          echo "Black check passed with --line-length 120"
          echo "PASS"

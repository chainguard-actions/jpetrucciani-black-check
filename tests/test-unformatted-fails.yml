name: Test unformatted code fails check
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          path: tests/fixtures/unformatted
        continue-on-error: true
      - name: Assert action failed on unformatted code
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail on unformatted code, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed on unformatted code"

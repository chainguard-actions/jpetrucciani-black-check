name: Test black_flags input - custom line length flag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          path: tests/fixtures/good.py
          black_flags: "--line-length 120"
      - name: Assert black check passed with custom flags
        env:
          OUTPUT: ${{ steps.action.outputs.output }}
        run: |
          echo "output: $OUTPUT"
          echo "PASS: black check succeeded with --line-length 120 flag"

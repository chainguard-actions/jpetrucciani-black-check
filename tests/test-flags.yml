name: Test black_flags input - diff flag on formatted file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          path: tests/fixtures/formatted.py
          black_flags: '--diff'
      - name: Assert action succeeded with diff flag
        env:
          OUTPUT: ${{ steps.action.outputs.output }}
        run: |
          echo "output: $OUTPUT"
          echo "PASS: black --diff ran successfully on formatted file"

name: Test basic - well-formatted Python passes black check
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          path: tests/fixtures/good.py

      - name: Assert black check passed on well-formatted file
        run: |
          echo "Black check completed successfully on well-formatted code"
          echo "PASS"

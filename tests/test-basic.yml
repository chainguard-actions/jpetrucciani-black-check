name: Test basic usage - formatted code passes
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          path: tests/fixtures/formatted
      - name: Assert action succeeded
        run: |
          echo "Black check passed on properly formatted code"
          echo "PASS"

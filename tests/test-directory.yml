name: Test directory path - run black check on a directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          path: tests/fixtures/good

      - name: Assert black check passed on good directory
        run: |
          echo "PASS: black check succeeded on tests/fixtures/good directory"

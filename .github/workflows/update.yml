name: check for black updates
on: {workflow_dispatch, schedule: [cron: '0 0 * * *']}

permissions: {}

jobs:
  check-for-updates:
    runs-on: ubuntu-22.04
    name: check for black updates
    permissions:
      contents: write
      pull-requests: write
    env:
      GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
      - name: setup python
        uses: actions/setup-python@e9aba2c848f5ebd159c070c61ea2c4e2b122355e # v2
        with:
          python-version: '3.10'
          architecture: x64
      - id: version
        name: check version
        run: |
          pip install -U black
          pip freeze | grep 'black==' >requirements.txt
          version="$(sed -E 's#black==(.*)#\1#g' ./requirements.txt)"
          echo "version=$version" >>$GITHUB_OUTPUT
          echo "message=automatic black update [$version]" >>$GITHUB_OUTPUT
      - uses: peter-evans/create-pull-request@9825ae65b1cb54b543b938503728b432a0176d29 # v3.10.0
        id: new_pull_request
        with:
          delete-branch: true
          title: ${{ steps.version.outputs.message }}
          commit-message: ${{ steps.version.outputs.message }}
          branch: automatic-black-update
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      - if: steps.new_pull_request.outputs.pull-request-url != ''
        env:
          PR_URL: ${{ steps.new_pull_request.outputs.pull-request-url }}
        run: gh pr merge --auto --squash "$PR_URL"
